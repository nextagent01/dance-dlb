name: SNSの最新投稿を更新

on:
  schedule:
    - cron: '17 * * * *'   # 1時間ごと
  workflow_dispatch:       # 手動でも実行できる

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/update-sns.mjs
      - name: 変更があればコミット
        run: |
          if [ -n "$(git status --porcelain sns-latest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sns-latest.json
            git commit -m "SNSの最新投稿を更新"
            git push
          fi
